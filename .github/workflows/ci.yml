name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8.3,<9"

      - name: Run pytest
        run: |
          set +e
          python -m pytest tests/ -q 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          {
            echo "### pytest result (exit=$rc)"
            echo '```'
            sed -n '1,220p' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Doctor (offline self-check)
        run: python findskills.py doctor --path .