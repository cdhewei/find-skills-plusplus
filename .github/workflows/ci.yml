name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate SKILL.md frontmatter
        run: |
          python - <<'PY'
          import re, sys
          p = "SKILL.md"
          try:
              t = open(p, encoding="utf-8").read()
          except FileNotFoundError:
              print("SKILL.md 缺失"); sys.exit(1)
          m = re.match(r"^---\n(.*?)\n---", t, re.S)
          if not m:
              print("SKILL.md 缺少合法 frontmatter"); sys.exit(1)
          fm = m.group(1)
          for field in ("name", "description", "version", "author", "license"):
              if not re.search(rf"^{field}:\s*.+", fm, re.M):
                  print(f"frontmatter 缺字段: {field}"); sys.exit(1)
          if "metadata:" not in t:
              print("frontmatter 缺 metadata 块"); sys.exit(1)
          print("✅ SKILL.md frontmatter 合法（含 version + metadata）")

      - name: Validate references/ (progressive disclosure)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          need = ["security.md", "cli.md", "ranking.md", "enhancements.md", "roadmap.md"]
          miss = [f for f in need if not (Path("references") / f).is_file()]
          if miss:
              print("references/ 缺失:", miss); sys.exit(1)
          if not Path("skill-card.md").is_file():
              print("缺少 skill-card.md"); sys.exit(1)
          print("✅ references/ 与 skill-card.md 齐备")
          PY

      # 自查必须排除 tests/（内含恶意样本夹具），否则会把自己判成 EXTREME。
      # 审查第三方技能时绝不加 --exclude-tests。
      # 注：扫描本仓库自身会如实返回 HIGH（工具自身用 subprocess 且文档化攻击模式），
      # 这是预期且诚实的，不代表工具可疑；其价值在审计第三方技能（见 smoke.py）。
      - name: Self-test security scanner (expect HIGH on self by design)
        run: |
          python scripts/security_scan.py --path . --lang zh-CN --exclude-tests || true
          echo "scanner 退出码: $?  (self-scan HIGH 为预期，不影响 CI)"

      - name: Run pytest
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests/ -q

      # 端到端冒烟：真跑子命令 + 自证检测力 + 文档数字一致性。
      # 单测证明函数对，冒烟证明「用户真的敲下去能跑、文档没吹牛」。
      - name: End-to-end smoke
        run: python scripts/smoke.py
